<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arduino 3D Simülatör</title>
<style>
:root{--bg:#0f141b;--panel:#161d27;--panel2:#1c2531;--line:#2a3646;--tx:#e6edf5;--mut:#8fa0b5;--acc:#4cc2ff;--ok:#5ee08a;--bad:#ff6b6b;--warn:#ffcf5a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,"Segoe UI",sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:1fr;height:100vh}
#app.open{grid-template-columns:1fr 440px}
#app:not(.open) #side{display:none}
#app.open.wide{grid-template-columns:1fr 800px}
#tabs{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
#tabs .sp{flex:1}
#tabs .tab.on{background:#24507a;border-color:var(--acc)}
#srcInfo{font-size:12px;color:var(--mut)}
#blocksWrap{flex:1;min-height:220px;position:relative;border-bottom:1px solid var(--line)}
#blocklyDiv{position:absolute;inset:0}
#code[readonly]{color:#93a4b8}
.blocklyToolboxDiv{background:#e8edf4!important}
.blocklyTreeLabel{color:#1d2733!important;font-family:system-ui,"Segoe UI",sans-serif!important}
.blocklyTreeRow{height:26px!important;line-height:26px!important}
#quick{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;z-index:5}
#quick button{padding:6px 12px}
#view{position:relative;overflow:hidden;min-height:0;min-width:0}
canvas#c{width:100%;height:100%;display:block;touch-action:none}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:#1f6f43;border-color:#2c9a5e}
button.danger{background:#7a2b2b;border-color:#a54545}
select{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 6px}
.card{background:rgba(22,29,39,.92);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px)}
#palette{position:absolute;left:10px;top:10px;padding:10px;width:230px;max-height:calc(100% - 20px);overflow:auto}
#palette h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
#palette .row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
#palette .row button{flex:1}
#palette hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;flex:none}
.sw.on{border-color:#fff}
.sw.auto{background:conic-gradient(#e53935,#fdd835,#43a047,#1e88e5,#e53935);}
#hud{position:absolute;left:10px;bottom:10px;padding:10px 12px;min-width:250px;max-width:340px;font-size:13px}
#hud .l{display:flex;justify-content:space-between;gap:12px}
#hud .w{color:var(--warn);margin-top:4px}
#hud .e{color:var(--bad);margin-top:4px}
#hud input[type=range]{width:100%}
#props{position:absolute;right:10px;bottom:10px;padding:10px 12px;min-width:270px;font-size:13px;z-index:4}
#hint{position:absolute;right:10px;top:10px;padding:8px 10px;font-size:12px;color:var(--mut);max-width:300px}
#tip{position:fixed;pointer-events:none;background:#000c;border:1px solid var(--line);padding:3px 7px;border-radius:6px;font-size:12px;display:none;z-index:9;white-space:nowrap}
#side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
#bar{display:flex;gap:6px;padding:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
#bar .sp{flex:1}
#code{flex:1;min-height:120px;width:100%;resize:none;background:#0c1118;color:#d6e2f0;border:0;border-bottom:1px solid var(--line);padding:10px;font:13px/1.45 Consolas,"Cascadia Mono",monospace;tab-size:2;outline:none;white-space:pre}
#status{padding:5px 10px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);min-height:26px}
#status.err{color:var(--bad)} #status.ok{color:var(--ok)}
#shead{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
#serial{height:150px;margin:0;padding:8px 10px;overflow:auto;background:#0c1118;font:12px/1.4 Consolas,monospace;color:#9be7b0;white-space:pre-wrap}
@media(max-width:900px){#app.open{grid-template-columns:1fr;grid-template-rows:55vh 1fr}#palette{width:190px}#hint{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="c"></canvas>
    <div id="quick" class="card">
      <button id="qCode" title="Kod penceresini aç/kapat">&lt;/&gt; Kod</button>
      <button id="qRun" class="primary">▶</button>
      <button id="qStop">■</button>
    </div>
    <div id="palette" class="card">
      <h4>Parça ekle</h4>
      <div class="row"><button id="addLed">+ LED</button>
        <select id="ledColor"><option value="kirmizi">Kırmızı</option><option value="yesil">Yeşil</option><option value="sari">Sarı</option><option value="mavi">Mavi</option><option value="beyaz">Beyaz</option></select></div>
      <div class="row"><button id="addRes">+ Direnç</button>
        <select id="resVal"><option value="100">100 Ω</option><option value="220" selected>220 Ω</option><option value="330">330 Ω</option><option value="470">470 Ω</option><option value="1000">1 kΩ</option><option value="2200">2.2 kΩ</option><option value="4700">4.7 kΩ</option><option value="10000">10 kΩ</option><option value="100000">100 kΩ</option></select></div>
      <div class="row"><button id="addHc">+ HC-SR04</button><button id="addObs">+ Engel</button></div>
      <div class="row"><button id="addBtn">+ Buton</button><button id="addBuz">+ Buzzer</button></div>
      <div class="row"><button id="addSeg">+ 7 Segment</button><button id="addLcd">+ LCD 16×2</button></div>
      <div class="row"><button id="addPot">+ Pot (10k)</button><button id="addBb">+ Breadboard</button></div>
      <div class="row"><button id="addServo">+ Servo</button><button id="addStep">+ Step motor</button></div>
      <div class="row"><button id="addDht">+ DHT11</button><button id="addLdr">+ LDR</button></div>
      <div class="row"><button id="addRelay">+ Röle</button><button id="addRgb">+ RGB LED</button></div>
      <hr>
      <h4>Proje</h4>
      <div class="row"><button id="saveProj">💾 Kaydet</button><button id="loadProj">📂 Aç</button></div>
      <input type="file" id="projFile" accept=".json,application/json" style="display:none">
      <hr>
      <h4>Kablo rengi</h4>
      <div class="row" id="wireColors"></div>
      <hr>
      <h4>Görünüm</h4>
      <div class="row"><button id="camTop">Üstten</button><button id="camPersp">Perspektif</button></div>
      <hr>
      <div class="row"><button id="repair">LED onar</button><button id="clearAll" class="danger">Temizle</button></div>
    </div>
    <div id="hint" class="card">Bir <b>pine tıkla</b>, sonra başka bir pine tıkla → kablo.<br>Parçayı sürükle · <b>R</b> döndür · <b>Del</b> sil<br>Kabloya sağ tık = kabloyu sil · Esc = iptal</div>
    <div id="hud" class="card"></div>
    <div id="props" class="card" style="display:none"></div>
    <div id="tip"></div>
  </div>
  <aside id="side">
    <div id="bar">
      <button id="run" class="primary">▶ Çalıştır</button>
      <button id="stop">■ Durdur</button>
      <button id="mute" title="Buzzer sesi">🔊</button>
      <select id="speed" title="Simülasyon hızı"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="5">5×</option><option value="20">20×</option></select>
      <span class="sp"></span>
      <select id="examples"></select>
    </div>
    <div id="tabs">
      <button id="tabBlocks" class="tab">🧩 Bloklar</button>
      <button id="tabText" class="tab on">{ } Metin</button>
      <span class="sp"></span>
      <span id="srcInfo"></span>
    </div>
    <div id="blocksWrap" style="display:none"><div id="blocklyDiv"></div></div>
    <textarea id="code" spellcheck="false"></textarea>
    <div id="status">Hazır.</div>
    <div id="shead"><span>Seri Monitör</span><button id="sclear" style="padding:2px 8px">Temizle</button></div>
    <pre id="serial"></pre>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/blockly_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/blocks_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/msg/tr.js"></script>
<script>
'use strict';
/* =====================================================================
   Arduino 3D Simülatör — Arduino Uno, LED, direnç, HC-SR04, kablolar
   1 dünya birimi = 0.5 cm (parçalar cm olarak modellenip U=2 ile büyütülür)
   ===================================================================== */
const U = 2;
const STOP = { stop: true };
const $ = id => document.getElementById(id);

/* ---------------------------- sahne ---------------------------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f141b);
scene.fog = new THREE.Fog(0x0f141b, 180, 600);
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 2000);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.minDistance = 5; controls.maxDistance = 300;
function setCam(pos, tgt) { camera.position.set(pos[0], pos[1], pos[2]); controls.target.set(tgt[0], tgt[1], tgt[2]); controls.update(); }

scene.add(new THREE.HemisphereLight(0xdfeaff, 0x30384a, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(25, 50, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 160 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshStandardMaterial({ color: 0x1b2330, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(800, 160, 0x32425a, 0x242f40); grid.position.y = 0.02; scene.add(grid);

function resize() {
  const v = $('view'); const w = v.clientWidth, h = v.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($('view')); resize();

/* ---------------------------- yardımcılar ---------------------------- */
const stdMat = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6, metalness: 0.1 }, o || {}));
const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
const goldMat = stdMat(0xd4af37, { metalness: 0.9, roughness: 0.3 });
const metalMat = stdMat(0xc8ccd2, { metalness: 0.9, roughness: 0.3 });
const goldM2 = stdMat(0xd9b24a, { metalness: 0.7, roughness: 0.35 });
const steelMat = stdMat(0xdfe3e9, { metalness: 0.3, roughness: 0.4 });
const blackMat = stdMat(0x15181d, { roughness: 0.7 });
function box(w, h, d, m, x, y, z) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x || 0, y || 0, z || 0); return o; }
function cyl(rt, rb, h, m, x, y, z, seg) { const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 20), m); o.position.set(x || 0, y || 0, z || 0); return o; }
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; }
function labelSprite(text, color, h) {
  const t = canvasTex(256, 64, (g, w, hh) => { g.font = 'bold 40px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = color || '#fff'; g.shadowColor = '#000'; g.shadowBlur = 6; g.fillText(text, w / 2, hh / 2); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  s.scale.set(h * 4, h, 1); return s;
}
/* Parçanın altına, LCD'deki gibi bacak adları baskılı bir devre kartı koyar */
function plate(g, w, d, cx, cz, draw) {
  const S = 100;
  const t = canvasTex(Math.round(w * S), Math.round(d * S), (gg) => {
    gg.fillStyle = '#1b6b3a'; gg.fillRect(0, 0, w * S, d * S);
    gg.strokeStyle = 'rgba(255,255,255,.45)'; gg.lineWidth = 2; gg.strokeRect(3, 3, w * S - 6, d * S - 6);
    gg.textAlign = 'center'; gg.textBaseline = 'middle';
    draw(gg, x => (x - cx + w / 2) * S, z => (z - cz + d / 2) * S);
  });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ map: t, roughness: 0.6 }));
  p.rotation.x = -Math.PI / 2; p.position.set(cx, 0.03, cz); p.userData.nocast = true; g.add(p);
}
const padDot = (gg, x, z) => { gg.fillStyle = '#d4af37'; gg.beginPath(); gg.arc(x, z, 7, 0, 7); gg.fill(); };
const txt = (gg, s, x, z, col, px) => { gg.fillStyle = col; gg.font = 'bold ' + px + 'px Arial'; gg.fillText(s, x, z); };
function pinTag(g, text, color, x, y, z, h) {
  const t = canvasTex(128, 64, (gg, w, hh) => {
    gg.fillStyle = 'rgba(10,14,20,.78)'; gg.beginPath(); gg.roundRect ? gg.roundRect(4, 8, w - 8, hh - 16, 14) : gg.rect(4, 8, w - 8, hh - 16); gg.fill();
    gg.font = 'bold 34px Arial'; gg.textAlign = 'center'; gg.textBaseline = 'middle'; gg.fillStyle = color || '#fff'; gg.fillText(text, w / 2, hh / 2 + 2);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false, depthWrite: false }));
  s.scale.set(h * 2, h, 1); s.position.set(x, y, z); s.renderOrder = 50; s.userData.nocast = true; g.add(s); return s;
}
const glowTex =canvasTex(128, 128, (g, w, h) => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.35, 'rgba(255,255,255,.35)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h); });
const EDGE_MAT = new THREE.LineBasicMaterial({ color: 0x0b0f14 });
const shade = grp => {
  const add = [];
  grp.traverse(o => {
    if (o.isMesh && !o.userData.isTerm && !o.userData.nocast && o.material.opacity !== 0) {
      o.castShadow = true; o.receiveShadow = true;
      const gt = o.geometry.type;
      if (!o.userData.noedge && !o.material.transparent && (gt === 'BoxGeometry' || gt === 'CylinderGeometry' || gt === 'ExtrudeGeometry')) add.push(o);
    }
  });
  add.forEach(o => {
    if (!o.geometry.userData.edges) o.geometry.userData.edges = new THREE.EdgesGeometry(o.geometry, 35);
    const l = new THREE.LineSegments(o.geometry.userData.edges, EDGE_MAT); l.userData.nocast = true; l.raycast = () => {}; o.add(l);
  });
};

/* ---------------------------- bileşen kaydı ---------------------------- */
const comps = [], wires = [];
const idc = { led: 0, res: 0, hc: 0, obs: 0, bb: 0, btn: 0, buz: 0, seg: 0, lcd: 0, pot: 0, servo: 0, step: 0, dht: 0, ldr: 0, relay: 0, rgb: 0 };
const tkey = (c, n) => c.id + ':' + n;
const sphereCache = {};
function addTerm(c, name, label, x, y, z, r) {
  r = r || 0.12;
  const geo = sphereCache[r] || (sphereCache[r] = new THREE.SphereGeometry(r, 8, 8));
  const m = new THREE.Mesh(geo, hitMat);
  m.position.set(x, y, z); m.userData = { comp: c, name, isTerm: true };
  c.group.add(m); c.terms[name] = { mesh: m, label };
}
function newComp(type, id, name, group) {
  const c = { type, id, name, group, terms: {} };
  group.userData.comp = c; group.scale.setScalar(U);
  scene.add(group); comps.push(c); return c;
}
function termPos(c, n) { c.group.updateMatrixWorld(true); return c.terms[n].mesh.getWorldPosition(new THREE.Vector3()); }
const arduino = () => comps.find(c => c.type === 'ard');
const sensors = () => comps.filter(c => c.type === 'hc');
const pinName = n => n <= 13 ? 'D' + n : 'A' + (n - 14);

/* ---------------------------- Arduino Uno ---------------------------- */
const BW = 6.86, BH = 5.34, PITCH = 0.254;
function buildArduino() {
  const g = new THREE.Group();
  const c = newComp('ard', 'ard', 'Arduino Uno', g);
  const steel = stdMat(0xe2e6ec, { metalness: 0.25, roughness: 0.4 });
  const goldM = new THREE.MeshStandardMaterial({ color: 0xd9b24a, metalness: 0.9, roughness: 0.3, side: THREE.DoubleSide });
  const plastic = stdMat(0x16191e, { roughness: 0.55 });
  const Y = 0.16; // kart üst yüzeyi
  // kart: yuvarlak köşeli, 4 montaj deliği
  const holes = [[-2.03, 2.42], [-1.9, -2.4], [3.18, 1.91], [3.18, -0.88]];
  const sh = new THREE.Shape(), r = 0.18, hw = BW / 2, hh = BH / 2;
  sh.moveTo(-hw + r, -hh); sh.lineTo(hw - r, -hh); sh.quadraticCurveTo(hw, -hh, hw, -hh + r); sh.lineTo(hw, hh - r); sh.quadraticCurveTo(hw, hh, hw - r, hh);
  sh.lineTo(-hw + r, hh); sh.quadraticCurveTo(-hw, hh, -hw, hh - r); sh.lineTo(-hw, -hh + r); sh.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
  holes.forEach(([hx, hz]) => { const p = new THREE.Path(); p.absarc(hx, -hz, 0.17, 0, Math.PI * 2, true); sh.holes.push(p); });
  const board = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: Y, bevelEnabled: false, curveSegments: 14 }), stdMat(0x124a96, { roughness: 0.42, metalness: 0.05 }));
  board.rotation.x = -Math.PI / 2; g.add(board);
  holes.forEach(([hx, hz]) => { const ring = new THREE.Mesh(new THREE.RingGeometry(0.17, 0.31, 28), goldM); ring.rotation.x = -Math.PI / 2; ring.position.set(hx, Y + 0.004, hz); ring.userData.nocast = true; g.add(ring); });

  // pin yerleşimi (cm, kart merkezine göre)
  const pins = [];
  const topZ = -BH / 2 + 0.32, botZ = BH / 2 - 0.32;
  const d0x = BW / 2 - 0.55, gap = PITCH + 0.41;
  const g2 = ['D7', 'D6', 'D5', 'D4', 'D3', 'D2', 'D1', 'D0'];
  g2.forEach((n, i) => pins.push({ n, x: d0x - (7 - i) * PITCH, z: topZ, top: true }));
  const d7x = d0x - 7 * PITCH;
  const g1 = ['SCL', 'SDA', 'AREF', 'GND_T', 'D13', 'D12', 'D11', 'D10', 'D9', 'D8'];
  g1.forEach((n, i) => pins.push({ n, x: d7x - gap - (9 - i) * PITCH, z: topZ, top: true }));
  const a5x = d0x;
  ['A0', 'A1', 'A2', 'A3', 'A4', 'A5'].forEach((n, i) => pins.push({ n, x: a5x - (5 - i) * PITCH, z: botZ, top: false }));
  const a0x = a5x - 5 * PITCH;
  ['NC', 'IOREF', 'RESET', '3V3', '5V', 'GND_B1', 'GND_B2', 'VIN'].forEach((n, i) => pins.push({ n, x: a0x - gap - (7 - i) * PITCH, z: botZ, top: false }));
  const lab = { GND_T: 'GND', GND_B1: 'GND', GND_B2: 'GND', '3V3': '3.3V', NC: '' };
  const pwm = ['D3', 'D5', 'D6', 'D9', 'D10', 'D11'];
  const labelOf = n => (pwm.includes(n) ? '~' : '') + (lab[n] !== undefined ? lab[n] : n);

  // serigrafi (şeffaf zemin, beyaz yazı)
  const S = 200;
  const tex = canvasTex(Math.round(BW * S), Math.round(BH * S), (gg, w, h) => {
    gg.clearRect(0, 0, w, h);
    gg.strokeStyle = 'rgba(255,255,255,.55)'; gg.lineWidth = 3; gg.strokeRect(14, 14, w - 28, h - 28);
    gg.fillStyle = '#fff'; gg.textBaseline = 'middle'; gg.textAlign = 'center';
    gg.font = 'bold 120px Arial'; gg.fillText('UNO', 1090, 400);
    gg.font = 'bold 26px Arial'; gg.fillText('ARDUINO', 760, 470);
    gg.strokeStyle = '#7fe0e8'; gg.lineWidth = 12; gg.beginPath(); gg.arc(718, 392, 34, 0.2, Math.PI * 2 - 0.2); gg.stroke(); gg.beginPath(); gg.arc(804, 392, 34, Math.PI + 0.2, Math.PI * 3 - 0.2); gg.stroke();
    gg.fillStyle = '#fff'; gg.font = 'bold 22px Arial'; gg.fillText('−', 718, 392); gg.fillText('+', 804, 392);
    pins.forEach(p => {
      const t = labelOf(p.n); if (!t) return;
      const px = (p.x + BW / 2) * S;
      gg.save();
      if (p.top) { gg.translate(px, 92); gg.rotate(Math.PI / 2); } else { gg.translate(px, h - 92); gg.rotate(-Math.PI / 2); }
      gg.font = 'bold 22px monospace'; gg.textAlign = 'left'; gg.fillText(t, 0, 0); gg.restore();

  const obs = comps.filter(c => c.type === 'obs').map(c => c.body); if (!obs.length) return null;

function liftAt(x, z) {
  for (const bb of comps) if (bb.type === 'bb') {
    bb.group.updateMatrixWorld(true);
    const l = bb.group.worldToLocal(new THREE.Vector3(x, 0, z));
    if (Math.abs(l.x) <= BB.W / 2 && Math.abs(l.z) <= BB.D / 2) return BB.top * U + bb.group.position.y;
  }
  return 0;
}
const FIXED = ['bb', 'ard', 'obs'];
function trySnap(c) {
  c.plugs = []; netsDirty = true; dirty = true;
  if (FIXED.includes(c.type)) return;
  c.group.position.y = 0;

  const names = Object.keys(c.terms), t0 = names[0];
  c.group.updateMatrixWorld(true);
  const p0 = termPos(c, t0); let best = null; const hp = new THREE.Vector3();
  for (const bb of bbs) { bb.group.updateMatrixWorld(true); for (const hn in bb.terms) { bb.terms[hn].mesh.getWorldPosition(hp); const d = Math.hypot(hp.x - p0.x, hp.z - p0.z); if (d < 1.4 && (!best || d < best.d)) best = { d, bb, hn, x: hp.x, z: hp.z }; } }
  if (!best) { updateWiresFor(c); return; }
  c.group.rotation.y = Math.round(c.group.rotation.y / (Math.PI / 2)) * Math.PI / 2;
  c.group.updateMatrixWorld(true);
  const q0 = termPos(c, t0);
  c.group.position.x += best.x - q0.x; c.group.position.z += best.z - q0.z; c.group.position.y = BB.top * U + best.bb.group.position.y;
  c.group.updateMatrixWorld(true);
  names.forEach(n => {
    const p = termPos(c, n); let bd = 0.2, bh = null;
    for (const hn in best.bb.terms) { best.bb.terms[hn].mesh.getWorldPosition(hp); const d = Math.hypot(hp.x - p.x, hp.z - p.z); if (d < bd) { bd = d; bh = hn; } }
    if (bh) c.plugs.push({ term: n, bb: best.bb, hole: bh });
  });
  updateWiresFor(c);
}
function placeOn(bb, c, hole, q) {
  c.group.rotation.y = (q || 0) * Math.PI / 2; c.group.updateMatrixWorld(true);
  const hp = bb.terms[hole].mesh.getWorldPosition(new THREE.Vector3()); const t0 = termPos(c, Object.keys(c.terms)[0]);
  c.group.position.x += hp.x - t0.x; c.group.position.z += hp.z - t0.z; trySnap(c);
}

/* ---------------------------- Proje kaydet / aç ---------------------------- */
const PERSIST = { led: ['kind', 'burned'], res: ['value'], pot: ['pos'], ldr: ['light'], dht: ['temp', 'hum'], relay: ['activeLow'] };
const MAKERS = {
  led: o => addLED(o.kind || 'kirmizi', o.x, o.z, o.rot), res: o => addResistor(o.value || 220, o.x, o.z, o.rot), hc: o => addSensor(o.x, o.z, o.rot), obs: o => addObstacle(o.x, o.z, o.rot),
  btn: o => addButton(o.x, o.z, o.rot), buz: o => addBuzzer(o.x, o.z, o.rot), seg: o => addSevenSeg(o.x, o.z, o.rot), lcd: o => addLCD(o.x, o.z, o.rot), pot: o => addPot(o.x, o.z, o.rot),
  bb: o => addBreadboard(o.x, o.z), servo: o => addServo(o.x, o.z, o.rot), step: o => addStepper(o.x, o.z, o.rot), dht: o => addDHT(o.x, o.z, o.rot),
  ldr: o => addLDR(o.x, o.z, o.rot), relay: o => addRelay(o.x, o.z, o.rot), rgb: o => addRGB(o.x, o.z, o.rot)
};
function serializeProject() {
  const idx = new Map(comps.map((c, i) => [c, i]));
  return {
    app: 'arduino-sim', version: 1, saved: new Date().toISOString(),
    comps: comps.map(c => {
      const o = { type: c.type, x: c.group.position.x, y: c.group.position.y, z: c.group.position.z, rot: c.group.rotation.y };
      (PERSIST[c.type] || []).forEach(k => { o[k] = c[k]; });
      if (c.plugs && c.plugs.length) o.plugs = c.plugs.map(p => ({ term: p.term, bb: idx.get(p.bb), hole: p.hole }));
      return o;
    }),
    wires: wires.map(w => ({ a: [idx.get(w.a.comp), w.a.name], b: [idx.get(w.b.comp), w.b.name], color: w.color })),
    code: $('code').value, blocks: ws ? Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(ws)) : null, tab: curTab,
    camera: { pos: camera.position.toArray(), target: controls.target.toArray() }, speed: $('speed').value
  };
}
function loadProject(p) {
  if (!p || p.app !== 'arduino-sim' || !Array.isArray(p.comps)) throw new Error('geçerli bir proje dosyası değil');
  stopProgram(true); clearScene();
  const made = [arduino()], a0 = p.comps[0];
  if (a0) { made[0].group.position.set(a0.x, a0.y || 0, a0.z); made[0].group.rotation.y = a0.rot || 0; }
  for (let i = 1; i < p.comps.length; i++) {
    const o = p.comps[i], mk = MAKERS[o.type];
    if (!mk) { made.push(null); continue; }
    const c = mk(o); c.group.position.y = o.y || 0; (PERSIST[o.type] || []).forEach(k => { if (o[k] !== undefined) c[k] = o[k]; }); made.push(c);
  }
  p.comps.forEach((o, i) => { const c = made[i]; if (c && o.plugs) c.plugs = o.plugs.filter(pl => made[pl.bb]).map(pl => ({ term: pl.term, bb: made[pl.bb], hole: pl.hole })); });
  made.forEach(c => { if (c) c.group.updateMatrixWorld(true); });
  (p.wires || []).forEach(w => { const A = made[w.a[0]], B = made[w.b[0]]; if (A && B && A.terms[w.a[1]] && B.terms[w.b[1]]) connect(A, w.a[1], B, w.b[1], w.color); });
  netsDirty = dirty = true;
  if (p.code !== undefined) $('code').value = p.code;
  if (ws && p.blocks) loadBlocks(p.blocks); else if (ws) syncFromText();
  textDirty = false; setTab(p.tab || 'text'); if (p.camera) setCam(p.camera.pos, p.camera.target); if (p.speed) $('speed').value = p.speed;
  updateInfo(); setStatus('Proje yüklendi.', 'ok');
}
function saveProject() {
  const blob = new Blob([JSON.stringify(serializeProject(), null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'arduino-proje-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  setStatus('Proje indirildi: ' + a.download, 'ok');
}
$('saveProj').onclick = saveProject;
$('loadProj').onclick = () => $('projFile').click();
$('projFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { loadProject(JSON.parse(await f.text())); } catch (err) { setStatus('Proje açılamadı: ' + err.message, 'err'); } e.target.value = ''; };
window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); saveProject(); } });

/* ---------------------------- HUD ve döngü ---------------------------- */
const hud = $('hud'); let hudT = 0, sliderBusy = false;
const hudInfo = document.createElement('div'); const distBox = document.createElement('div');
distBox.style.cssText = 'margin-top:6px;display:none';
distBox.innerHTML = '<div class="l" style="color:var(--mut);font-size:12px"><span>Engel mesafesi</span><span id="distVal"></span></div><input id="dist" type="range" min="2" max="150" step="1" value="30">';
hud.append(hudInfo, distBox);
const distSl = $('dist'), distVal = $('distVal');
distSl.addEventListener('pointerdown', () => { sliderBusy = true; });
distSl.addEventListener('input', () => { sliderBusy = true; placeObstacle(+distSl.value); clearTimeout(distSl._t); distSl._t = setTimeout(() => { sliderBusy = false; }, 600); });
window.addEventListener('pointerup', () => { setTimeout(() => { sliderBusy = false; }, 300); });
function updateHud() {
  const parts = [];
  sensors().forEach(s => {
    const d = measureDistance(s);
    parts.push('<div class="l"><span>' + s.name + '</span><b>' + (!s.powered ? '<span style="color:var(--warn)">besleme yok</span>' : d === null ? '> 400 cm' : d.toFixed(1) + ' cm') + '</b></div>');
    s._d = d;
  });
  comps.filter(c => c.type === 'led').forEach(c => {
    parts.push('<div class="l"><span>' + c.name + ' (' + LED_TYPES[c.kind].ad + ')</span><b>' + (c.burned ? '<span style="color:var(--bad)">yandı ✖</span>' : (c.current * 1000).toFixed(1) + ' mA') + '</b></div>');
  });
  comps.forEach(c => {
    if (c.type === 'btn') parts.push('<div class="l"><span>' + c.name + '</span><b>' + (c.pressed ? 'BASILI' : 'bırakıldı') + '</b></div>');
    else if (c.type === 'buz') parts.push('<div class="l"><span>' + c.name + '</span><b>' + (c.sounding ? '♪ ' + Math.round(c.freq) + ' Hz' + (muted ? ' (sessiz)' : '') : 'sessiz') + '</b></div>');
    else if (c.type === 'servo') parts.push('<div class="l"><span>' + c.name + '</span><b>' + (c.powered ? Math.round(c.angle) + '°' : '<span style="color:var(--warn)">besleme yok</span>') + '</b></div>');
    else if (c.type === 'step') parts.push('<div class="l"><span>' + c.name + '</span><b>' + (c.powered ? (c.steps / 2048 * 360).toFixed(0) + '° (' + c.steps + ' adım)' : '<span style="color:var(--warn)">besleme yok</span>') + '</b></div>');
    else if (c.type === 'dht') parts.push('<div class="l"><span>' + c.name + '</span><b>' + (c.powered ? c.temp + ' °C · %' + c.hum : '<span style="color:var(--warn)">besleme yok</span>') + '</b></div>');
    else if (c.type === 'ldr') parts.push('<div class="l"><span>' + c.name + '</span><b>ışık %' + c.light + '</b></div>');
    else if (c.type === 'relay') parts.push('<div class="l"><span>' + c.name + '</span><b>' + (!c.powered ? '<span style="color:var(--warn)">besleme yok</span>' : c.on ? 'ÇEKTİ (COM–NO)' : 'bırakık (COM–NC)') + '</b></div>');
    else if (c.type === 'rgb') parts.push('<div class="l"><span>' + c.name + '</span><b>' + ['R', 'G', 'B'].map(k => c.segs[k].burned ? '✖' : Math.round(Math.min(1, c.segs[k].current / 0.012) * 100) + '%').join(' / ') + '</b></div>');
    else if (c.type === 'pot') parts.push('<div class="l"><span>' + c.name + ' (düğmeyi sürükle)</span><b>' + Math.round(c.pos * 100) + '% · ' + fmtOhm(Math.round(c.pos * c.value)) + '</b></div>');
    else if (c.type === 'lcd') {
      parts.push('<div class="l"><span>' + c.name + '</span><b>' + (!c.powered ? '<span style="color:var(--warn)">besleme yok</span>' : c.init ? 'çalışıyor' : 'başlatılmadı') + '</b></div>');
      if (c.powered && !c.contrastOK) parts.push('<div class="w">LCD: V0 pinini GND’ye bağla (kontrast).</div>');
      if (c.powered && c.contrastOK && !c.rwOK) parts.push('<div class="w">LCD: RW pinini GND’ye bağla.</div>');
      if (c.powered && c.init && !c.wiringOK) parts.push('<div class="w">LCD: RS/E/D4–D7 bağlantıları koddaki LiquidCrystal pinleriyle uyuşmuyor.</div>');
    }
    else if (c.type === 'seg') { const on = Object.keys(c.segs).filter(k => c.segs[k].on && !c.segs[k].burned).join(' '); parts.push('<div class="l"><span>' + c.name + '</span><b>' + (on || '—') + '</b></div>'); }
  });
  const s0 = sensors()[0], o0 = comps.find(c => c.type === 'obs');
  warnings.forEach(w => parts.push('<div class="' + (w.startsWith('KISA') ? 'e' : 'w') + '">⚠ ' + w + '</div>'));
  if (!parts.length) parts.push('<span style="color:var(--mut)">Henüz ölçülecek parça yok.</span>');
  hudInfo.innerHTML = parts.join('');
  distBox.style.display = (s0 && o0) ? 'block' : 'none';
  if (s0 && o0 && !sliderBusy && s0._d !== null && s0._d !== undefined) distSl.value = Math.round(Math.min(150, Math.max(2, s0._d)));
  distVal.textContent = distSl.value + ' cm';
}
function animate(now) {
  requestAnimationFrame(animate);
  controls.update(); ensureSolved(); updateAudio();
  const dt = Math.min(0.1, (now - (animate.last || now)) / 1000); animate.last = now;
  comps.forEach(c => {
    if (c.type === 'servo') {
      const d = c.target - c.angle, st = 420 * dt; c.angle += Math.abs(d) <= st ? d : Math.sign(d) * st;
      c.horn.rotation.y = -c.angle * Math.PI / 180;
    } else if (c.type === 'step') {
      c.shaft.rotation.y = -c.steps * 2 * Math.PI / 2048;
      c.leds.forEach((m, i) => { m.emissiveIntensity = c.powered && c.coils[i] ? 2 : 0; });
    } else if (c.type === 'relay') {
      c.led.emissiveIntensity = c.on ? 2 : 0;
    } else if (c.type === 'rgb') {
      const r = c.segs.R.burned ? 0 : Math.min(1, c.segs.R.current / 0.012), gg = c.segs.G.burned ? 0 : Math.min(1, c.segs.G.current / 0.012), b = c.segs.B.burned ? 0 : Math.min(1, c.segs.B.current / 0.012);
      const mx = Math.max(r, gg, b);
      c.mat.color.setRGB(0.15 + r * 0.85, 0.15 + gg * 0.85, 0.15 + b * 0.85); c.mat.emissive.setRGB(r, gg, b); c.mat.emissiveIntensity = mx * 1.8;
      c.glow.material.color.setRGB(Math.max(r, 0.01), Math.max(gg, 0.01), Math.max(b, 0.01)); c.glow.material.opacity = mx * 0.95;
      c.light.color.setRGB(Math.max(r, 0.01), Math.max(gg, 0.01), Math.max(b, 0.01)); c.light.intensity = mx * 2.2;
    }
  });
  comps.forEach(c => {
    if (c.type === 'led') {
      const b = c.burned ? 0 : Math.min(1.3, c.current / 0.012);
      c.mat.emissiveIntensity = 0.05 + b * 1.7; c.glow.material.opacity = Math.min(1, b) * 0.95; c.light.intensity = b * 2.2;
      if (c.burned) { c.mat.color.setHex(0x2a2a2a); c.mat.emissive.setHex(0x000000); } else { const t = LED_TYPES[c.kind]; c.mat.color.setHex(t.c); c.mat.emissive.setHex(t.c); }
    } else if (c.type === 'seg') {
      Object.values(c.segs).forEach(d => { const b = d.burned ? 0 : Math.min(1.3, d.current / 0.008); d.mat.emissiveIntensity = b * 2; });
    } else if (c.type === 'pot') {
      c.knob.rotation.y = -(c.pos * 270 - 135) * Math.PI / 180;
    } else if (c.type === 'lcd') {
      updateLcdTex(c);
    } else if (c.type === 'btn') {
      c.cap.position.y = c.pressed ? 0.62 : 0.75;
    } else if (c.type === 'ard') {
      const s = pins[13]; c.boardLed.material.emissiveIntensity = 0.05 + (s && s.mode === 'OUT' ? s.duty * 2 : 0);
    }
  });
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i], age = (performance.now() - r.userData.t0) / 900;
    if (age >= 1) { r.parent && r.parent.remove(r); rings.splice(i, 1); continue; }
    r.scale.setScalar(1 + age * 2.2); r.position.z = 1.3 + age * 14; r.material.opacity = 0.8 * (1 - age);
  }
  if (selBox) selBox.update();
  if (now - hudT > 140) { hudT = now; updateHud(); }
  renderer.render(scene, camera);
}

/* ---------------------------- başlat ---------------------------- */
buildArduino(); resetPins(); initBlockly(); loadExample(0);
requestAnimationFrame(animate);
window.__sim = { comps, wires, runProgram, stopProgram, transpile, pins: () => pins, get lastSolve() { return lastSolve; } };
